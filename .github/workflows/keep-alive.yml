name: Keep Backend Alive

on:
  schedule:
    # Ping every 5 minutes (minimum interval GitHub Actions allows)
    - cron: '*/5 * * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://backend-rosy-tau-87.vercel.app/api/health)
          echo "Backend health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: backend returned $STATUS"
          fi

      - name: Ping DB check (warms up DB connection)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://backend-rosy-tau-87.vercel.app/api/db-check)
          echo "DB check status: $STATUS"
